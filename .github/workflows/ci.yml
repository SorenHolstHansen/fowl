name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lexer_up_to_date:
    name: Ensure lexer is generated
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Download re2rust
        run: sudo apt-get install re2c -y
      - name: Print re2rust version
        run: re2rust --version
      - name: Generate the lexer
        run: re2rust libs/lexer/src/lexing.re --output libs/lexer/src/lexing.rs --no-unsafe --start-conditions
      - name: Check if there are differences
        run: git diff --exit-code

