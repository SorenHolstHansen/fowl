name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --verbose

  fuzz:
    name: Smoke-Test Fuzz Targets
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - run: cargo install cargo-afl
    - run: cargo afl system-config

    # Build and then run the fuzz target.
    - run: cargo afl build -p fowl-fuzz
    - run: timeout 300s cargo afl fuzz -i fuzz/corpus -o fuzz/artifacts target/debug/fowl-fuzz

    # Upload fuzzing artifacts on failure for post-mortem debugging.
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: fuzzing-artifacts-${{ github.sha }}
        path: fuzz/artifacts
